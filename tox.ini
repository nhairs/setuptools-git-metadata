[tox]
requires = tox>=4,tox-uv
envlist = py310,py311,py312,py313,py314,py315,pypy310,pypy311,pypy312

[testenv]
description = run unit and build/install regression tests
dependency_groups = dev
commands = pytest tests {posargs}

[testenv:format]
description = run formatters
dependency_groups = dev
commands = black src tests

[testenv:lint]
description = validate packaging, formatting, lint and types
dependency_groups = dev
commands =
    validate-pyproject pyproject.toml
    black --check --diff src tests
    pylint src
    pyrefly check src tests
